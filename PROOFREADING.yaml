# Proofreading ledger for the math review of the book.
#
# One entry per section; update the entry when a section is reviewed.
#   text:      N.M.tex checked for mathematical correctness, typos, LaTeX/rendering problems
#   answers:   N.M-answers.tex checked against the exercises (work each one independently)
#   status:    todo | done | partial (say what is left in remarks) | n/a (no such file)
#   reviewed:  date of the review (YYYY-MM-DD)
#   findings:  one flow mapping per issue: {kind, where, note}; add `open: true` if not yet fixed
#   remarks:   free-form strings that are not findings (what was verified, what was skipped)
#
# Finding kinds:
#   math     wrong formula, derivation or statement in the text
#   answer   wrong solution in an answers file
#   ref      wrong cross-reference or label
#   typeset  LaTeX or rendering problem (captions, equation layout, missing symbols)
#   prose    typo or grammar
#
# Do not rewrite the author's content beyond clear errors; ask when a change is a judgement call.
# After fixing, run `make book` and check build/TRENCH_DIFFEQ_BV.log.

