name: Build and publish PDF

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # texlive.sh runs TeX in the pinned TeX Live image with podman, which the runner has.
      - name: Install pdfinfo
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Build book and chapters
        run: make all

      # Regenerate the extracts so they follow the current section sources.
      - name: Build examples and theorems
        run: |
          python3 scripts/extract-examples.py
          python3 scripts/extract-theorems.py
          make build/examples.pdf build/theorems.pdf

      - name: Check logs
        run: |
          ! grep -E "Reference .* undefined|multiply defined|Missing character" \
            build/TRENCH_DIFFEQ_BV.log build/examples.log build/theorems.log
          python3 scripts/check-extract-labels.py build/examples.aux build/TRENCH_DIFFEQ_BV.aux
          python3 scripts/check-extract-labels.py build/theorems.aux build/TRENCH_DIFFEQ_BV.aux

      - name: Assemble site
        run: |
          mkdir -p site/chapters
          cp pages/index.html site/
          cp build/TRENCH_DIFFEQ_BV.pdf build/examples.pdf build/theorems.pdf site/
          cp build/chapters/*.pdf site/chapters/

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
